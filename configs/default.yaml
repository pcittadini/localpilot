# LocalPilot configuration.
#
# Copy to ~/.config/localpilot/config.yaml (or point LOCALPILOT_CONFIG at it).
# Every key is optional: omitted keys keep the built-in defaults shown here.
# Unknown keys are rejected so typos in security settings fail loudly.
version: 1

# Workspace root for file access. Empty means the directory LocalPilot is
# started in, which for Claude Code is the project directory.
workspace: ""

providers:
  ollama:
    base_url: http://localhost:11434

models:
  default: qwen-local
  available:
    - name: qwen-local
      provider: ollama
      model: qwen3.5:9b        # any Ollama model tag; nothing is hardcoded
      temperature: 0.1
      max_tokens: 2048         # generated-token cap per call
      context_window: 8192     # sent as num_ctx; input budgets are clamped to fit
      think: false             # reasoning mode off: faster, fewer tokens

delegation:
  defaults:
    enabled: true
    fallback: claude           # advisory: tells Claude who takes over; LocalPilot never calls a cloud model
    require_validation: true

  budgets:
    max_input_tokens: 12000    # clamped to context_window - max_tokens
    max_output_tokens: 2048
    max_tool_calls: 8          # tool calls per task
    max_iterations: 5          # model calls per task; the last one must answer
    timeout_seconds: 60        # whole task, all model and tool calls

  # Per-category policy. Besides enabled, a category may set:
  #   model: <name from models.available>   (default: models.default)
  #   tools: [read_file, ...]               (subset of the tools below; [] = none)
  #   budgets: {max_tool_calls: 4, ...}     (overrides the budgets above)
  # A project can narrow all of this in .localpilot/config.yaml; see
  # configs/project.example.yaml.
  policies:
    - category: extraction
      enabled: true
    - category: summarization
      enabled: true
    - category: log_analysis
      enabled: true
    - category: code_analysis
      enabled: true
    - category: documentation
      enabled: true
    - category: code_generation
      enabled: false
    - category: architecture
      enabled: false
    - category: security_review
      enabled: false

  tools:
    # Read-only tools the local model may call. Unknown names are an error.
    allowed:
      - read_file
      - search_code
      - list_files
      - git_diff
      - git_log
    # Always refused, even if allowed. None of these exist in LocalPilot.
    denied:
      - shell
      - write_file
      - delete_file
      - network_request
    timeout_seconds: 10        # per tool call
    max_result_bytes: 8000     # per tool result returned to the model

# Local task database. It stores counts, timings, statuses and token
# estimates per task; never prompts, objectives, source code, file paths read
# by the model or tool output. The file and its directory are created
# private to the user. Only this global file can set these keys.
metrics:
  enabled: true
  path: ""                     # empty: $XDG_DATA_HOME/localpilot/metrics.db or ~/.local/share/localpilot/metrics.db
  retention_days: 180          # tasks older than this are deleted at startup; 0 keeps them

# How delegated work is valued in Claude terms (see get_savings_report).
# Claude token counts are estimates; local token counts are measured.
savings:
  billing: subscription        # subscription: usage avoided and its API-equivalent value, never "money saved"
                               # api: estimated API spend avoided
  reference_model: claude-opus-5-5   # the Claude model the work would otherwise have run on
  pricing:                     # USD per million tokens; Anthropic API list prices, October 2026
    - model: claude-fable-5-1
      input: 10.00
      output: 50.00
    - model: claude-opus-5-5
      input: 4.00
      output: 20.00
    - model: claude-sonnet-5-5
      input: 2.00
      output: 10.00
    - model: claude-haiku-5-5  # prompts up to 100K tokens
      input: 0.10
      output: 0.50

logging:
  level: info                  # debug, info, warn, error
  file: ""                     # empty: stderr (never stdout, which carries MCP messages)
