name: Feature request
description: Suggest an improvement or new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security impact
      description: Does this give the local model new capabilities (writes, shell, network, new tools)? Such changes need a design discussion first.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
